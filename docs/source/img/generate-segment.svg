<svg viewBox="0 0 560 324" fill="none" stroke="currentColor" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anatomy of one generated segment: FReferenceSplineMeshParams passed to GenerateAsset, plus the CalcSliceTransformAtSplineOffset and CalcWidthsAtSplineOffset helpers">
<style>svg{color:#404040}</style>
<defs>
<marker id="gen-ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="currentColor" stroke="none"/></marker>
<marker id="gen-ah2" markerWidth="8" markerHeight="8" refX="1" refY="3" orient="auto"><path d="M6,0 L0,3 L6,6 Z" fill="currentColor" stroke="none"/></marker>
</defs>

<!-- context strip: the whole lane run is chopped into segments -->
<text x="168" y="13" fill="currentColor" stroke="none" font-family="sans-serif" font-size="9" fill-opacity="0.65">the lane run is split into segments — GenerateAsset() is called once per segment</text>
<line x1="168" y1="26" x2="500" y2="26" stroke="currentColor" stroke-opacity="0.5"/>
<g stroke="currentColor" stroke-opacity="0.5"><line x1="168" y1="21" x2="168" y2="31"/><line x1="250" y1="21" x2="250" y2="31"/><line x1="334" y1="21" x2="334" y2="31"/><line x1="416" y1="21" x2="416" y2="31"/><line x1="500" y1="21" x2="500" y2="31"/></g>
<rect x="250" y="20" width="84" height="12" fill="currentColor" fill-opacity="0.12" stroke="none"/>
<line x1="292" y1="34" x2="232" y2="72" stroke="currentColor" stroke-opacity="0.4" stroke-dasharray="3 3" marker-end="url(#gen-ah)"/>

<!-- lane band -->
<path d="M80,180 C190,180 330,115 470,115 L470,205 C330,205 190,270 80,270 Z" fill="currentColor" fill-opacity="0.06" stroke="none"/>
<path d="M80,180 C190,180 330,115 470,115" stroke="currentColor" stroke-opacity="0.35"/>
<path d="M80,270 C190,270 330,205 470,205" stroke="currentColor" stroke-opacity="0.35"/>
<text x="150" y="171" fill="currentColor" stroke="none" font-family="sans-serif" font-size="9" fill-opacity="0.5">lane boundary</text>

<!-- the segment: an anchor Hermite spline -->
<path d="M80,225 C190,225 330,160 470,160" stroke="currentColor" stroke-width="2"/>

<!-- start endpoint -->
<circle cx="80" cy="225" r="4" fill="currentColor" stroke="none"/>
<line x1="80" y1="225" x2="152" y2="224" stroke="currentColor" marker-end="url(#gen-ah)"/>
<text x="26" y="246" fill="currentColor" stroke="none" font-family="sans-serif" font-size="10" font-weight="600">StartPos</text>
<text x="115" y="240" fill="currentColor" stroke="none" font-family="sans-serif" font-size="9" fill-opacity="0.85">StartTangent</text>

<!-- end endpoint -->
<circle cx="470" cy="160" r="4" fill="currentColor" stroke="none"/>
<line x1="470" y1="160" x2="516" y2="160" stroke="currentColor" marker-end="url(#gen-ah)"/>
<text x="476" y="150" fill="currentColor" stroke="none" font-family="sans-serif" font-size="10" font-weight="600">EndPos</text>
<text x="474" y="176" fill="currentColor" stroke="none" font-family="sans-serif" font-size="9" fill-opacity="0.85">EndTangent</text>

<!-- lane-width brackets at the segment start -->
<line x1="96" y1="181" x2="96" y2="223" stroke="currentColor" stroke-opacity="0.85" marker-start="url(#gen-ah2)" marker-end="url(#gen-ah)"/>
<line x1="96" y1="227" x2="96" y2="269" stroke="currentColor" stroke-opacity="0.85" marker-start="url(#gen-ah2)" marker-end="url(#gen-ah)"/>
<text x="103" y="205" fill="currentColor" stroke="none" font-family="sans-serif" font-size="9">StartLeftWidth</text>
<text x="103" y="252" fill="currentColor" stroke="none" font-family="sans-serif" font-size="9">StartRightWidth</text>

<!-- sample transform at fractional offset alpha -->
<circle cx="300" cy="189" r="3.5" fill="currentColor" stroke="none"/>
<line x1="300" y1="189" x2="345" y2="179" stroke="currentColor" marker-end="url(#gen-ah)"/>
<line x1="300" y1="189" x2="286" y2="153" stroke="currentColor" marker-end="url(#gen-ah)"/>
<text x="305" y="204" fill="currentColor" stroke="none" font-family="sans-serif" font-size="11" font-style="italic">&#945;</text>

<!-- helper captions -->
<text x="80" y="300" fill="currentColor" stroke="none" font-family="sans-serif" font-size="10"><tspan font-weight="600">CalcSliceTransformAtSplineOffset(&#945;)</tspan> &#8594; world FTransform anywhere along the segment</text>
<text x="80" y="315" fill="currentColor" stroke="none" font-family="sans-serif" font-size="10"><tspan font-weight="600">CalcWidthsAtSplineOffset(&#945;)</tspan> &#8594; (LeftWidth, RightWidth) at that point</text>
</svg>
