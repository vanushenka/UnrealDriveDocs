<svg viewBox="0 0 560 240" fill="none" stroke="currentColor" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The generation lifecycle: BeginGenerateAsset fires once per output actor, GenerateAsset once per segment, EndGenerateAsset once at the end; all three reach the same generated component through the Get Or Add Generated Component node, which identifies it by its ComponentTag">
<style>svg{color:#404040}</style>
<defs>
<marker id="life-ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="currentColor" stroke="none"/></marker>
</defs>

<!-- group captions -->
<text x="76" y="22" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif" font-size="9" fill-opacity="0.65">once per actor</text>
<text x="282" y="22" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif" font-size="9" fill-opacity="0.65">once per segment</text>
<text x="488" y="22" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif" font-size="9" fill-opacity="0.65">once per actor</text>

<!-- the three events -->
<rect x="14" y="30" width="124" height="34" rx="3" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/>
<text x="76" y="51" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif" font-size="10" font-weight="600">BeginGenerateAsset</text>

<rect x="178" y="30" width="64" height="34" rx="3" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/>
<rect x="250" y="30" width="64" height="34" rx="3" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/>
<rect x="322" y="30" width="64" height="34" rx="3" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/>
<text x="210" y="51" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif" font-size="9" font-weight="600">Generate</text>
<text x="282" y="51" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif" font-size="9" font-weight="600">Generate</text>
<text x="354" y="51" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif" font-size="9" font-weight="600">Generate</text>
<text x="404" y="52" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif" font-size="12" fill-opacity="0.55">&#8230;</text>

<rect x="430" y="30" width="116" height="34" rx="3" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/>
<text x="488" y="51" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif" font-size="10" font-weight="600">EndGenerateAsset</text>

<!-- flow between the events -->
<line x1="140" y1="47" x2="172" y2="47" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#life-ah)"/>
<line x1="416" y1="47" x2="424" y2="47" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#life-ah)"/>

<!-- the output actor and the one component every event shares -->
<rect x="120" y="112" width="320" height="78" rx="4" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.35"/>
<text x="132" y="128" fill="currentColor" stroke="none" font-family="sans-serif" font-size="9" fill-opacity="0.6">_Gen actor</text>
<rect x="160" y="138" width="240" height="32" rx="3" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-opacity="0.5"/>
<text x="280" y="158" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif" font-size="10" font-weight="600">InstancedStaticMeshComponent</text>
<text x="280" y="183" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif" font-size="8.5" fill-opacity="0.6">ComponentTags = [ MyDescriptor_C ]</text>

<!-- each event reaches that component -->
<line x1="76" y1="66" x2="164" y2="136" stroke="currentColor" stroke-opacity="0.5" stroke-dasharray="3 3" marker-end="url(#life-ah)"/>
<text x="72" y="104" fill="currentColor" stroke="none" font-family="sans-serif" font-size="9" fill-opacity="0.8">creates</text>

<line x1="282" y1="66" x2="282" y2="134" stroke="currentColor" stroke-opacity="0.5" stroke-dasharray="3 3" marker-end="url(#life-ah)"/>
<text x="290" y="104" fill="currentColor" stroke="none" font-family="sans-serif" font-size="9" fill-opacity="0.8">Add Instance</text>

<line x1="488" y1="66" x2="398" y2="136" stroke="currentColor" stroke-opacity="0.5" stroke-dasharray="3 3" marker-end="url(#life-ah)"/>
<text x="470" y="104" text-anchor="end" fill="currentColor" stroke="none" font-family="sans-serif" font-size="9" fill-opacity="0.8">finalizes</text>

<!-- legend -->
<text x="14" y="214" fill="currentColor" stroke="none" font-family="sans-serif" font-size="9.5">All three events reach it with the same <tspan font-weight="600">Get Or Add Generated Component</tspan> node: it creates the component on</text>
<text x="14" y="228" fill="currentColor" stroke="none" font-family="sans-serif" font-size="9.5">the first call and finds it afterwards, because the ComponentTag &#8212; not a Blueprint variable &#8212; is its identity.</text>
</svg>
